<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>SAGAD AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #243b63, #101827 65%);
    }
    main {
      width: min(100%, 440px); text-align: center; padding: 34px 24px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 24px;
      background: rgba(255,255,255,.07); box-shadow: 0 18px 50px #0005;
    }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 18px; display: grid;
      place-items: center; border-radius: 24px; font-size: 34px;
      font-weight: bold; color: #101827; background: #d9b4ff;
    }
    h1 { margin: 8px 0; font-size: 34px; }
    p { color: #d5deed; line-height: 1.8; margin: 12px 0 26px; }
    a {
      display: block; padding: 15px 18px; border-radius: 14px;
      background: #8b5cf6; color: white; text-decoration: none;
      font-size: 18px; font-weight: bold;
    }
    a:active { transform: scale(.98); }
    small { display: block; margin-top: 20px; color: #aab8cc; }
  </style>
</head>
<body>
  <main>
    <div class="logo">S</div>
    <h1>SAGAD AI</h1>
    <p>مرحباً بك في تطبيق SAGAD AI<br>اضغط على الزر بالأسفل لفتح ChatGPT الرسمي والبدء بالمحادثة.</p>
    <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">افتح ChatGPT</a>
    <small>يحتاج اتصالاً بالإنترنت.</small>
  </main>
</body>
</html>
